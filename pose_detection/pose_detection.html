<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MoveNet (browser) - Pose Detection</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      display:flex; flex-direction:column; align-items:center;
      gap:12px; padding:16px; background:#111; color:#eee;
    }
    #videoWrap { 
      position:relative; 
      width:1080px; max-width:95vw; 
    }
    #video, #overlay {
      width:100%; height:auto; border-radius:8px; display:block;
    }
    #overlay {
      position:absolute;
      top:0; left:0;
      pointer-events:none; /* evita blocchi mouse */
    }
    #controls { display:flex; gap:8px; }
    button { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; background:#1f6feb; color:white; }
    button.secondary { background:#2d2d2d; }
    #status { font-size:0.9rem; color:#aaa; }
  </style>
</head>
<body>
  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">Avvio...</div>

  <!-- Librerie TF.js e Pose Detection (CDN UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection/dist/pose-detection.min.js"></script>

  <script>
  (async () => {
    const video   = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const status  = document.getElementById('status');

    const model = poseDetection.SupportedModels.MoveNet;
    const modelConfig = {
      modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
    };

    let detector = null;
    let streaming = false;
    let latestKeypoints = null;

    const KEYPOINT_NAMES = [
      "nose","left_eye","right_eye","left_ear","right_ear",
      "left_shoulder","right_shoulder","left_elbow","right_elbow",
      "left_wrist","right_wrist","left_hip","right_hip",
      "left_knee","right_knee","left_ankle","right_ankle"
    ];
    const SKELETON = [
      [0,1],[0,2],[1,3],[2,4],
      [0,5],[0,6],[5,7],[7,9],[6,8],[8,10],
      [5,6],[11,12],[11,13],[13,15],[12,14],[14,16]
    ];

    function resizeCanvasToVideo() {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
    }

    function drawResults(keypoints) {
      const ctx = overlay.getContext('2d');
      ctx.clearRect(0,0,overlay.width,overlay.height);

      if (!keypoints) return;
      ctx.lineWidth = 2;

      // Skeleton
      for (const [a,b] of SKELETON) {
        const ka = keypoints[a];
        const kb = keypoints[b];
        if (ka.score > 0.3 && kb.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(ka.x, ka.y);
          ctx.lineTo(kb.x, kb.y);
          ctx.strokeStyle = 'rgba(0,255,150,0.9)';
          ctx.stroke();
        }
      }

      // Keypoints
      for (let i=0;i<keypoints.length;i++) {
        const k = keypoints[i];
        if (k.score >= 0.3) {
          ctx.beginPath();
          ctx.fillStyle = 'rgba(255,60,80,0.95)';
          ctx.arc(k.x, k.y, 5, 0, Math.PI*2);
          ctx.fill();

          ctx.font = "12px Arial";
          ctx.fillStyle = "white";
          ctx.fillText(`${KEYPOINT_NAMES[i]}`, k.x + 6, k.y - 6);
        }
      }
    }

    async function initDetector() {
      status.textContent = 'Caricamento modello MoveNet...';
      await tf.setBackend('webgl');
      detector = await poseDetection.createDetector(model, modelConfig);
      status.textContent = 'Modello caricato.';
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720 }, audio: false });
        video.srcObject = stream;
        await video.play();
        resizeCanvasToVideo();
        streaming = true;
        status.textContent = 'Camera attiva — in inferenza...';
        runDetectionLoop();
      } catch (e) {
        console.error(e);
        status.textContent = 'Errore accesso camera: ' + (e.message || e);
      }
    }

    async function runDetectionLoop() {
      if (!streaming) return;
      if (!detector) {
        requestAnimationFrame(runDetectionLoop);
        return;
      }
      try {
        const poses = await detector.estimatePoses(video, { maxPoses: 1 });
        if (poses.length > 0) {
          latestKeypoints = poses[0].keypoints;
          drawResults(latestKeypoints);
          status.textContent = `Persona rilevata`;
        } else {
          latestKeypoints = null;
          drawResults(null);
          status.textContent = 'Nessuna persona rilevata';
        }
      } catch (err) {
        console.error('Errore inferenza:', err);
      }
      requestAnimationFrame(runDetectionLoop);
    }


    if (!detector) await initDetector();
    await startCamera();

    window.addEventListener('resize', () => {
      if (video.videoWidth) resizeCanvasToVideo();
    });
  })();
  </script>
</body>
</html>
